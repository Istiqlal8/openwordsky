<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#1a1d24}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script></head>
<body><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
r.setSize(520,760); r.setPixelRatio(2); r.toneMapping = THREE.ACESFilmicToneMapping;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1a1d24);
const cam = new THREE.PerspectiveCamera(35, 520/760, 0.01, 1000);
sc.add(new THREE.HemisphereLight(0xdfefff, 0x404050, 2.0));
const k = new THREE.DirectionalLight(0xffffff, 2.6); k.position.set(3,5,4); sc.add(k);
const f = new THREE.DirectionalLight(0x99bbff, 1.1); f.position.set(-4,2,-3); sc.add(f);
new GLTFLoader().load('../assets/models/mech-gundam.glb', (g)=>{
  const o = g.scene; sc.add(o);
  const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  window.__info = {size:[+s.x.toFixed(2),+s.y.toFixed(2),+s.z.toFixed(2)], meshes:0, tris:0, bones:0};
  o.traverse(n=>{ if(n.isMesh){__info.meshes++; __info.tris += n.geometry.index? n.geometry.index.count/3 : n.geometry.attributes.position.count/3;} if(n.isBone)__info.bones++; });
  __info.tris = Math.round(__info.tris);
  window.__bones = []; o.traverse(n=>{ if(n.isBone) __bones.push(n.name); });
  window.__anims = g.animations.map(a=>a.name);
  const d = Math.max(s.x,s.y,s.z);
  window.__shot = (ang)=>{ cam.position.set(c.x+Math.sin(ang)*d*1.7, c.y+d*0.12, c.z+Math.cos(ang)*d*1.7); cam.lookAt(c); r.render(sc,cam); };
  __shot(0); window.__ready = true;
});
</script></body></html>
